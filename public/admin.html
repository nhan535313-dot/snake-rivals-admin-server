
<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Snake Rivals 3D — Admin</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 20px;
      background: #10131b;
      color: #f4f6ff;
      font-family: Arial, sans-serif;
    }

    main {
      width: 100%;
      max-width: 850px;
      margin: auto;
    }

    section {
      background: #1a2030;
      border: 1px solid #30394e;
      border-radius: 14px;
      padding: 18px;
      margin: 16px 0;
    }

    h1 { color: #77f0bd; }
    h2 { font-size: 20px; }

    input, button {
      display: block;
      width: 100%;
      padding: 12px;
      margin: 9px 0;
      border-radius: 8px;
      border: 1px solid #46516b;
      font-size: 16px;
    }

    input {
      background: #10131b;
      color: white;
    }

    button {
      background: #77f0bd;
      color: #10131b;
      font-weight: bold;
      cursor: pointer;
      border: 0;
    }

    button.danger {
      background: #ff6978;
    }

    .muted { color: #b4bfd5; }
    .hidden { display: none; }
    .room {
      border: 1px solid #3b4660;
      border-radius: 8px;
      padding: 12px;
      margin: 10px 0;
    }

    #message {
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }
  </style>
</head>
<body>
<main>
  <h1>🐍 Snake Rivals 3D</h1>
  <p class="muted">Bảng điều khiển máy chủ</p>
  <p id="message" role="status"></p>

  <section id="login">
    <h2>Đăng nhập Admin</h2>

    <form id="loginForm">
      <input id="username"
             autocomplete="username"
             placeholder="Tên tài khoản"
             required>

      <input id="password"
             type="password"
             autocomplete="current-password"
             placeholder="Mật khẩu"
             required>

      <button type="submit">Gửi mã OTP</button>
    </form>
  </section>

  <section id="otpSection" class="hidden">
    <h2>Xác minh email</h2>
    <p>Email nhận mã: <strong id="maskedEmail">Đang tải...</strong></p>
    <p class="muted">Mã OTP có 6 chữ số và hết hạn sau 5 phút.</p>

    <form id="otpForm">
      <input id="otp"
             inputmode="numeric"
             autocomplete="one-time-code"
             maxlength="6"
             pattern="[0-9]{6}"
             placeholder="Nhập mã OTP"
             required>

      <button type="submit">Xác minh OTP</button>
    </form>

    <button id="backButton" type="button">Quay lại đăng nhập</button>
  </section>

  <section id="dashboard" class="hidden">
    <h2>Quản lý phòng</h2>
    <p class="muted">
      Email OTP được cấu hình trên máy chủ.
      Trang này không có chức năng thay đổi email.
    </p>

    <form id="createRoomForm">
      <input id="roomName"
             maxlength="40"
             placeholder="Tên phòng mới"
             required>

      <input id="maxPlayers"
             type="number"
             min="2"
             max="100"
             value="8"
             required>

      <button type="submit">+ Tạo phòng</button>
    </form>

    <button id="refreshButton" type="button">
      Làm mới danh sách
    </button>

    <div id="rooms"></div>

    <button id="logoutButton" class="danger" type="button">
      Đăng xuất
    </button>
  </section>
</main>

<script>
  const $ = (id) => document.getElementById(id);

  function message(text) {
    $("message").textContent = text || "";
  }

  async function api(url, options = {}) {
    const response = await fetch(url, {
      credentials: "same-origin",
      ...options,
      headers: {
        "Content-Type": "application/json",
        ...(options.headers || {})
      }
    });

    const data = await response.json().catch(() => ({}));

    if (!response.ok || data.success === false) {
      throw new Error(data.message || "Yêu cầu thất bại.");
    }

    return data;
  }

  function showScreen(screen) {
    $("login").classList.toggle("hidden", screen !== "login");
    $("otpSection").classList.toggle("hidden", screen !== "otp");
    $("dashboard").classList.toggle("hidden", screen !== "dashboard");
  }

  async function loadOtpInfo() {
    try {
      const data = await api("/api/admin/otp-info");
      $("maskedEmail").textContent = data.email;
    } catch {
      $("maskedEmail").textContent = "Chưa cấu hình";
    }
  }

  $("loginForm").addEventListener("submit", async (event) => {
    event.preventDefault();
    message("Đang xác minh tài khoản...");

    try {
      const data = await api("/api/admin/login", {
        method: "POST",
        body: JSON.stringify({
          username: $("username").value,
          password: $("password").value
        })
      });

      $("password").value = "";
      await loadOtpInfo();
      showScreen("otp");
      message(data.message);
      $("otp").focus();
    } catch (error) {
      message(error.message);
    }
  });

  $("otpForm").addEventListener("submit", async (event) => {
    event.preventDefault();
    message("Đang kiểm tra OTP...");

    try {
      const data = await api("/api/admin/verify-otp", {
        method: "POST",
        body: JSON.stringify({
          otp: $("otp").value.trim()
        })
      });

      $("otp").value = "";
      showScreen("dashboard");
      message(data.message);
      await loadRooms();
    } catch (error) {
      $("otp").value = "";
      message(error.message);
    }
  });

  $("backButton").addEventListener("click", () => {
    $("otp").value = "";
    showScreen("login");
    message("");
  });

  async function loadRooms() {
    try {
      const data = await api("/api/admin/rooms");
      const container = $("rooms");
      container.replaceChildren();

      if (!data.rooms.length) {
        const empty = document.createElement("p");
        empty.textContent = "Chưa có phòng nào.";
        container.appendChild(empty);
        return;
      }

      for (const room of data.rooms) {
        const card = document.createElement("div");
        card.className = "room";

        const title = document.createElement("h3");
        title.textContent = room.name;

        const info = document.createElement("p");
        info.textContent =
          "ID: " + room.id +
          " | Người chơi: " + room.players + "/" + room.maxPlayers +
          " | Trạng thái: " + room.status;

        const close = document.createElement("button");
        close.className = "danger";
        close.textContent = "Đóng phòng";

        close.addEventListener("click", async () => {
          if (!confirm("Bạn có chắc muốn đóng phòng này?")) return;

          try {
            await api("/api/admin/rooms/" + encodeURIComponent(room.id), {
              method: "DELETE"
            });

            message("Đã đóng phòng.");
            await loadRooms();
          } catch (error) {
            message(error.message);
          }
        });

        card.append(title, info, close);
        container.appendChild(card);
      }
    } catch (error) {
      message(error.message);

      if (error.message.includes("đăng nhập")) {
        showScreen("login");
      }
    }
  }

  $("createRoomForm").addEventListener("submit", async (event) => {
    event.preventDefault();

    try {
      await api("/api/admin/rooms", {
        method: "POST",
        body: JSON.stringify({
          name: $("roomName").value.trim(),
          maxPlayers: Number($("maxPlayers").value)
        })
      });

      $("roomName").value = "";
      message("Đã tạo phòng.");
      await loadRooms();
    } catch (error) {
      message(error.message);
    }
  });

  $("refreshButton").addEventListener("click", loadRooms);

  $("logoutButton").addEventListener("click", async () => {
    try {
      await api("/api/admin/logout", {
        method: "POST",
        body: "{}"
      });

      showScreen("login");
      message("Đã đăng xuất.");
    } catch (error) {
      message(error.message);
    }
  });

  async function initialize() {
    try {
      await api("/api/admin/me");
      showScreen("dashboard");
      await loadRooms();
    } catch {
      showScreen("login");
      await loadOtpInfo();
    }
  }

  initialize();
</script>
</body>
</html>
